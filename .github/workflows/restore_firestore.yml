name: Restore Firestore from data.json

on:
  workflow_dispatch:

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Smart-merge data.json ↔ Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python backend/import_to_firestore.py

      - name: Commit & push merged data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data: smart-merge restore $(date +'%Y-%m-%d')"
          # The merged data.json is this job's output, so it wins a conflict
          # (-X theirs = our replayed commit during a rebase). The old fallback
          # here ran a bare `git pull`, which modern git refuses on diverged
          # branches ("Need to specify how to reconcile divergent branches"),
          # so every conflict took the whole job down with it.
          git pull --rebase -X theirs origin main
          git push
