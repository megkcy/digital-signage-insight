name: Restore Firestore from data.json

on:
  workflow_dispatch:

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Smart-merge data.json ↔ Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python backend/import_to_firestore.py

      - name: Commit & push merged data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data.json is fully machine-generated — never content-merge it (see
          # .gitattributes: this repo hit real corruption from `-X theirs`
          # alone, because this job's Firestore round-trip and the scraper's
          # own JSON don't share key order, so git's line diff auto-splices
          # "non-conflicting" hunks into invalid JSON without ever reporting a
          # conflict). The ours driver makes this file all-or-nothing:
          # whichever side is checked out wins — this job's freshly merged
          # output, since it's what we just committed.
          git config merge.ours.driver true
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data: smart-merge restore $(date +'%Y-%m-%d')"
          git fetch origin main
          git merge --no-edit origin/main
          git push
