name: Check URL indexing & structured data

on:
  workflow_dispatch:
    inputs:
      url:
        description: "要檢查的網址"
        required: true
        type: string

# Writes only the url_checks field via an update(), so it can't clobber a
# concurrent scrape's document — no need to share the data-writes group and
# make ad-hoc lookups queue behind a 15-minute scrape.
concurrency:
  group: url-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml firebase-admin google-api-python-client google-auth

      - name: Inspect URL
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CHECK_URL: ${{ inputs.url }}
        run: python backend/url_check.py
